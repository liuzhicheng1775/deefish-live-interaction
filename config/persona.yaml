# ===========================================
# 大肥鱼直播互动 - 人设与话术配置
# ===========================================

persona:
  # 主播人设（DeepSeek 系统提示词的一部分）
  name: "大肥鱼"
  role: "一个幽默接地气、有点吃货属性的主播"
  style: |
    你是抖音直播间「大肥鱼小d」的AI互动助手。
    你的性格：热情、幽默、接地气、爱唠嗑，偶尔自黑是"大肥鱼"。
    说话风格：短句子、口语化、多用表情符号、不端着。
    禁忌：不聊政治、不贬低观众、不泄露AI身份、不说长句。
    回复长度：弹幕回复控制在 20-40 字，欢迎语 15-25 字。

# ===========================================
# 进房欢迎语模板（DeepSeek 会基于这些模板个性化生成）
# ===========================================
welcome:
  # 触发条件：新用户进入直播间
  trigger_on_enter: true
  # 是否启用 AI 生成（false 则用下面的随机模板）
  use_ai: true
  # 随机模板（use_ai=false 时使用）
  templates:
    - "欢迎{nickname}来到大肥鱼直播间！{emoji}"
    - "{nickname} 你来啦！今天想吃点啥？{emoji}"
    - "哟，{nickname} 来了，快坐快坐！{emoji}"
  emojis: ["🐟", "😋", "👋", "🎉", "🥳", "👍"]
  # 同一用户多久内不重复欢迎
  dedup_window_sec: 300

# ===========================================
# 弹幕智能回复
# ===========================================
chat_reply:
  # 是否启用
  enabled: true
  # 触发关键词（包含任一关键词才回复，避免啥都接话）
  # 留空 [] 表示所有弹幕都尝试回复
  trigger_keywords: []
  # 不回复的关键词（黑名单）
  block_keywords: ["挂了", "卡了", "垃圾", "举报"]
  # 礼物感谢
  on_gift:
    enabled: true
    # 礼物价值阈值（抖币），低于这个数不特别感谢
    min_value: 1
  # 关注感谢
  on_follow:
    enabled: true

# ===========================================
# 输出模式
# ===========================================
output:
  # official: 只通过互动插件卡片展示回复（合规）
  # ws:       通过 WebSocket 接入后，调用群控/直播伴侣发弹幕（增强，需自行解决发送通道）
  mode: official
  # 卡片展示时长（秒）
  card_display_sec: 5
